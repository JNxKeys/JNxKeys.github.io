name = "jnxkeys-analytics-bot"
main = "worker/jnxkeys-analytics-bot.js"
compatibility_date = "2024-11-01"
account_id = "1f2f426c7bd82e8bbcf1ffe8e319d1d5"
workers_dev = true

# Ruta para capturar telemetría sin problemas de CORS
routes = [
  { pattern = "jnxkeys.com/api/*", zone_name = "jnxkeys.com" }
]

# Base de datos Serverless en Cloudflare KV (Métricas, Leads y Caja)
[[kv_namespaces]]
binding = "JNX_METRICS"
id = "2e6e5a6029384c69b1e320ffac32d420"

# Variables de entorno públicas
[vars]
TELEGRAM_CHAT_ID = "8616800327"
CF_ZONE_ID = "0713b73888bdbd3cbf99f8cd518d6e22"

# Nota: Para activar crons automáticos sin exceder el límite gratuito de Cloudflare (5 crons por cuenta),
# se pueden consultar bajo demanda vía Telegram (/resumen, /horarios, /top, /semana, /mes).
# [triggers]
# crons = ["30 4 * * *"]
