name = "jnxkeys-analytics-bot"
main = "worker/jnxkeys-analytics-bot.js"
compatibility_date = "2024-11-01"

# Base de datos Serverless en Cloudflare KV (Métricas, Leads y Caja)
[[kv_namespaces]]
binding = "JNX_METRICS"
id = "PEGAR_AQUI_ID_DEL_KV_NAMESPACE"

# Variables de entorno públicas
[vars]
TELEGRAM_CHAT_ID = "PEGAR_TU_ID_NUMERICO_TELEGRAM"
CF_ZONE_ID = "PEGAR_TU_ZONE_ID_DE_CLOUDFLARE"

# Disparadores programados automáticos (Hora Perú UTC-5)
[triggers]
crons = [
  "0 13 * * 1",   # Lunes 8:00 AM Perú (Reporte Semanal)
  "0 11 1 * *",   # Día 1 6:00 AM Perú (Reporte Mensual Ejecutivo con Gemini)
  "30 4 * * *"    # Diario 11:30 PM Perú (Cierre de Caja Diario)
]
